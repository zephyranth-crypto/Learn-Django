{% extends "base.html" %}
{% block start %}

    <a href="/contact/">
        Contact Us
    </a>
    |
    <a href="/about/">
        About Us
    </a>

    <h1> Hello wecome to django server ! </h1>

    <table>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Can Vote?</th>
    </tr>

    {% for people in peoples %}
    <tr>
        <td>{{ people.Name }}</td>
        <td>{{ people.Age }}</td>
        <td>
            {% if people.Age < 18 %}
                Cannot Vote
            {% else %}
                Can Vote
            {% endif %}
        </td>
    </tr>
    {% endfor %}
    </table>

{% endblock %}
